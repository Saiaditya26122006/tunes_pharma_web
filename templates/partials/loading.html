<style>
  .tp-loader {
    position: fixed; inset: 0;
    /* Frosted-glass overlay — transparent tint + backdrop blur */
    background: rgba(255, 255, 255, 0.45);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    backdrop-filter:         blur(28px) saturate(140%);
    z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .tp-loader.fade-out { opacity: 0; visibility: hidden; }

  .tp-loader-video {
    width: 72px; height: 72px;
    object-fit: contain;
    display: block;
    background: transparent;
    filter: drop-shadow(0 4px 14px rgba(15, 30, 45, 0.15));
    pointer-events: none;
  }

  .tp-loader-name {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem; font-weight: 600;
    color: rgba(15, 30, 45, 0.75);
    letter-spacing: 0.08em;
  }

  /* Fallback if the browser blocks autoplay or fails to load the video */
  .tp-loader-video-fallback {
    display: none;
    width: 48px; height: 48px;
    border: 3px solid rgba(15, 30, 45, 0.12);
    border-top-color: #1e6ff1;
    border-radius: 50%;
    animation: tp-spin 0.8s linear infinite;
  }
  .tp-loader.video-failed .tp-loader-video          { display: none; }
  .tp-loader.video-failed .tp-loader-video-fallback { display: block; }
  @keyframes tp-spin { to { transform: rotate(360deg); } }
</style>

<div class="tp-loader" id="globalLoading">
  <video
    class="tp-loader-video"
    src="{{ url_for('static', filename='videos/logo_video.webm') }}"
    autoplay muted loop playsinline
    disablepictureinpicture disableremoteplayback
    preload="metadata"
    aria-hidden="true"
    onerror="this.closest('.tp-loader').classList.add('video-failed')"
  ></video>
  <div class="tp-loader-video-fallback" aria-hidden="true"></div>
  <div class="tp-loader-name">Tunes Pharma</div>
</div>

<script>
(function () {
  function dismiss() {
    var el = document.getElementById('globalLoading');
    if (!el) return;
    el.classList.add('fade-out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 520);
  }
  if (document.readyState === 'complete') {
    dismiss();
  } else {
    window.addEventListener('load', dismiss);
  }
})();
</script>
