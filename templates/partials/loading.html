<style>
  .tp-loader {
    position: fixed; inset: 0;
    background: #0a1628;
    z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .tp-loader.fade-out { opacity: 0; visibility: hidden; }

  .tp-spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #1e6ff1;
    border-radius: 50%;
    animation: tp-spin 0.8s linear infinite;
  }
  @keyframes tp-spin { to { transform: rotate(360deg); } }

  .tp-loader-name {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem; font-weight: 600;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.08em;
  }
</style>

<div class="tp-loader" id="globalLoading">
  <div class="tp-spinner"></div>
  <div class="tp-loader-name">Tunes Pharma</div>
</div>

<script>
(function () {
  function dismiss() {
    var el = document.getElementById('globalLoading');
    if (!el) return;
    el.classList.add('fade-out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 520);
  }
  if (document.readyState === 'complete') {
    dismiss();
  } else {
    window.addEventListener('load', dismiss);
  }
})();
</script>
